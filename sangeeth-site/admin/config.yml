backend:
  name: git-gateway
  branch: main

media_folder: uploads
public_folder: /uploads

collections:
  - name: publications
    label: Publications
    file: data/publications.json
    format: json
    fields:
      - name: items
        label: Publications
        widget: list
        summary: "{{title}}"
        fields:
          - { name: title, label: Title, widget: string }
          - { name: year, label: Year, widget: string }
          - { name: venue, label: Venue, widget: string, required: false }
          - { name: status, label: Status, widget: select, default: Published, options: [Published, Forthcoming, In progress] }
          - { name: link, label: Link (web page, optional), widget: string, required: false }
          - { name: pdf, label: PDF file (optional), widget: file, required: false, allow_multiple: false }
